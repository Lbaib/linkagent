version: '3'
services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: linkedagent-nacos
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"

  postgres-vector:
    image: ankane/pgvector:v0.5.1
    container_name: linkedagent-postgres
    environment:
      POSTGRES_USER: linkedagent
      POSTGRES_PASSWORD: password
      POSTGRES_DB: linkedagent
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: linkedagent-redis
    ports:
      - "6379:6379"
