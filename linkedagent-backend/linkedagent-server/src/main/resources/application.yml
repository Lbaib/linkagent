spring:
  application:
    name: linkedagent-server
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/linkedagent
    username: linkedagent
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

openai:
  api:
    base-url: ${OPENAI_API_BASE_URL:https://yundu.lat}
    key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-5.5}
