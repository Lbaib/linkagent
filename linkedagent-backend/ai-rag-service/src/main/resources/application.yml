spring:
  application:
    name: ai-rag-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/linkedagent
    username: linkedagent
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8083

openai:
  api:
    base-url: ${OPENAI_API_BASE_URL:https://yundu.lat}
    key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-5.5}
