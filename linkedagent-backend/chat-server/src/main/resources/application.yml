spring:
  application:
    name: chat-server
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # Must match --server.address=127.0.0.1; otherwise Nacos may register a LAN/WSL IP gateway cannot reach
        ip: 127.0.0.1
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

server:
  port: 8081
