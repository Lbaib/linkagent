spring:
  application:
    name: customer-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # Must match --server.address=127.0.0.1; otherwise Nacos may register a LAN/WSL IP gateway cannot reach
        ip: 127.0.0.1
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/linkedagent
    username: linkedagent
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082
